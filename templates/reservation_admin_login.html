<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수원영통 예약 관리자 로그인</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f5f9; font-family: system-ui, sans-serif; color: #0f172a; }
    main { width: min(360px, calc(100% - 40px)); padding: 28px; background: #fff; border-radius: 16px; box-shadow: 0 15px 35px #0f172a22; }
    h1 { margin: 0 0 8px; font-size: 22px; } p { color: #475569; font-size: 14px; } input, button { box-sizing: border-box; width: 100%; padding: 12px; border-radius: 8px; font-size: 15px; } input { border: 1px solid #cbd5e1; } button { margin-top: 12px; border: 0; background: #0f766e; color: #fff; font-weight: 700; cursor: pointer; } .error { color: #b91c1c; }
  </style>
</head>
<body>
  <main>
    <h1>수원영통 예약 관리자</h1>
    <p>직원용 대관 예약금 관리 화면입니다.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="next" value="{{ next }}">
      <input name="password" type="password" autocomplete="current-password" placeholder="관리자 비밀번호" required autofocus>
      <button type="submit">로그인</button>
    </form>
  </main>
</body>
</html>
